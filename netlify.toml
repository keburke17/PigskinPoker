# Netlify build + function configuration.
#
# The frontend is a static Vite build; every privileged write goes through the single
# function in netlify/functions/api.mjs, which holds the secret key.
#
# Environment variables to set in the Netlify UI (never in this file, never in git):
#   VITE_SUPABASE_URL              public by design - ships to the browser
#   VITE_SUPABASE_PUBLISHABLE_KEY  public by design - ships to the browser
#   SUPABASE_URL                   same URL, for the function
#   SUPABASE_SECRET_KEY            SERVER ONLY. Bypasses RLS. Never prefix with VITE_.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Pin the runtime. Netlify's default Node version moves over time, and the function
  # is an ES module importing from outside its own directory - exactly the combination
  # that breaks quietly when the runtime shifts under it.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Stage 7: automatic stats pulls, for leagues that opted in (leagues.auto_pull_stats).
#
# EVERY THREE HOURS, and the reasoning is worth writing down because the obvious
# schedules are both wrong.
#
# nflverse publishes player stats after each game WINDOW rather than continuously -
# nightly, plus points through a game day (post-TNF, post-early, post-late, post-SNF,
# post-MNF). Chasing those exact times would mean six crons, and Netlify allows one
# schedule per function; it would also hardcode a publisher's timetable that is not a
# contract and has already moved once. Polling hourly instead would re-download an
# 8.6 MB file 168 times a week from a free, community-run source to save at most an
# hour of staleness on numbers nobody reads until the morning.
#
# Every three hours sits between the two: each publish point is picked up within one
# cycle, the schedule survives nflverse changing theirs, and it is one line.
#
# THE COST IS LOWER THAN 8x/DAY SUGGESTS. The eligibility guards run BEFORE the feed is
# fetched, and most of the week every league fails them - a league in 'pre-deal' on a
# Tuesday makes no outbound request at all. The file is only pulled for a league whose
# week is dealt, locked and mapped, which is the window the numbers are actually
# arriving in. See server/autoPull.js.
[functions."pull-stats-scheduled"]
  schedule = "0 */3 * * *"

# The old address, sent to the new one.
#
# This is FIRST on purpose. Rules are evaluated top to bottom, and the SPA fallback
# below carries no hostname - `from = "/*"` matches every host, including this one, and
# would win. Above `/api` too, so nothing whatsoever is served on the old address.
#
# The full URL in `from` is what makes the rule host-scoped; a path-only `from` cannot
# match on hostname and would redirect the new domain to itself, forever.
#
# Netlify does NOT do this for you. Setting a primary domain leaves the project "always
# accessible at a netlify.app subdomain" - it answered 200, not a redirect, which is two
# live origins holding two separate sessions, because localStorage is per-origin.
#
# It does not touch deploy previews (deploy-preview-N--pigskinpoker.netlify.app is a
# different hostname), and it is NOT a reason to drop the netlify.app entry from the
# Supabase redirect allow-list: the auth server decides whether to honour a sign-in link
# before any browser redirect happens, so that entry is what keeps links already sitting
# in inboxes working. See docs/EMAIL-SETUP.md section 3.
[[redirects]]
  from = "https://pigskinpoker.netlify.app/*"
  to = "https://pigskin.ballsohard.org/:splat"
  status = 301
  force = true

# Friendlier path than /.netlify/functions/api
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

# SPA fallback - the app has no router yet (P6), but this is correct either way.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
